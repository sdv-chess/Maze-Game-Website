<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Background Vignette -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1B2438"/>
      <stop offset="60%" stop-color="#0E131F"/>
      <stop offset="100%" stop-color="#070A10"/>
    </radialGradient>

    <!-- Neon Glow Accents -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4EFAEA"/>
      <stop offset="100%" stop-color="#219E8C"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="50%" stop-color="#E8C547"/>
      <stop offset="100%" stop-color="#A67C1E"/>
    </linearGradient>

    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D7A9FF"/>
      <stop offset="100%" stop-color="#793EC9"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Rounded Container / App Icon Frame -->
  <rect width="512" height="512" rx="108" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="url(#tealGrad)" stroke-width="3" opacity="0.35"/>

  <!-- ==================== ISOMETRIC CHESSBOARD MAZE BASE ==================== -->
  <g transform="translate(256, 320)" filter="url(#shadowFilter)">
    <!-- Base Platform Rim (3D Depth) -->
    <path d="M 0,-80 L 160,0 L 160,26 L 0,-54 Z" fill="#131926" opacity="0.9"/>
    <path d="M 0,-80 L -160,0 L -160,26 L 0,-54 Z" fill="#0C101A" opacity="0.9"/>
    <path d="M 0,-54 L 160,26 L 0,106 L -160,26 Z" fill="#161F30"/>
    <path d="M -160,26 L 0,106 L 0,132 L -160,52 Z" fill="#0E1420"/>
    <path d="M 160,26 L 0,106 L 0,132 L 160,52 Z" fill="#1A2436"/>

    <!-- Chessboard Checkered Grid (4x4 Isometric Tiles) -->
    <!-- Row 0 -->
    <polygon points="0,-80 40,-60 0,-40 -40,-60" fill="#243048"/>
    <polygon points="40,-60 80,-40 40,-20 0,-40" fill="#0E1422"/>
    <polygon points="80,-40 120,-20 80,0 40,-20" fill="#243048"/>
    <polygon points="120,-20 160,0 120,20 80,0" fill="#0E1422"/>

    <!-- Row 1 -->
    <polygon points="-40,-60 0,-40 -40,-20 -80,-40" fill="#0E1422"/>
    <polygon points="0,-40 40,-20 0,0 -40,-20" fill="#2A3752"/>
    <polygon points="40,-20 80,0 40,20 0,0" fill="#0E1422"/>
    <polygon points="80,0 120,20 80,40 40,20" fill="#243048"/>

    <!-- Row 2 -->
    <polygon points="-80,-40 -40,-20 -80,0 -120,-20" fill="#243048"/>
    <polygon points="-40,-20 0,0 -40,20 -80,0" fill="#0E1422"/>
    <polygon points="0,0 40,20 0,40 -40,20" fill="#2A3752"/>
    <polygon points="40,20 80,40 40,60 0,40" fill="#0E1422"/>

    <!-- Row 3 -->
    <polygon points="-120,-20 -80,0 -120,20 -160,0" fill="#0E1422"/>
    <polygon points="-80,0 -40,20 -80,40 -120,20" fill="#243048"/>
    <polygon points="-40,20 0,40 -40,60 -80,40" fill="#0E1422"/>
    <polygon points="0,40 40,60 0,80 -40,60" fill="#243048"/>

    <!-- Board Neon Outer Border -->
    <polygon points="0,-80 160,0 0,80 -160,0" fill="none" stroke="url(#tealGrad)" stroke-width="3" filter="url(#neonGlow)" opacity="0.65"/>

    <!-- Maze Circuit / Overlay Pathways Glowing on Board -->
    <path d="M -120,20 L -80,0 L -40,-20 L 0,-40 L 40,-20 L 40,20 L 0,40 L -40,20" 
          fill="none" stroke="#3ADBC4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    <circle cx="-120" cy="20" r="4.5" fill="#3ADBC4" filter="url(#neonGlow)"/>
    <circle cx="-40" cy="20" r="4.5" fill="#E8C547" filter="url(#neonGlow)"/>
  </g>

  <!-- ==================== GAME ARTIFACT: CROWN / ROOK TORCH ==================== -->
  <!-- Subtle Knight/Rook Chess Crest blended with Dungeon Torch -->
  <g transform="translate(256, 178)" filter="url(#shadowFilter)">
    <!-- Torch Glow Backdrop -->
    <circle cx="0" cy="-30" r="44" fill="#FF8C42" opacity="0.25" filter="url(#neonGlow)"/>
    <circle cx="0" cy="-32" r="22" fill="#FFE55C" opacity="0.5" filter="url(#neonGlow)"/>

    <!-- Flame / Torch Spark (The Exit Goal Indicator) -->
    <path d="M 0,-62 C 18,-42 22,-24 10,-12 C 0,-1 0,8 0,8 C 0,8 -2,-1 -10,-12 C -22,-24 -18,-42 0,-62 Z" 
          fill="url(#goldGrad)" filter="url(#neonGlow)"/>
    <path d="M 0,-48 C 8,-34 10,-22 4,-14 C -1,-6 0,0 0,0 C 0,0 -1,-6 -4,-14 C -10,-22 -8,-34 0,-48 Z" 
          fill="#FFFDF0"/>

    <!-- Heraldic Crest Shield with "SDV" -->
    <!-- Shield Outline -->
    <path d="M -72,-16 
             L 72,-16 
             L 72,36 
             C 72,88 0,118 0,118 
             C 0,118 -72,88 -72,36 
             Z" 
          fill="#101522" stroke="url(#goldGrad)" stroke-width="4.5"/>

    <!-- Inner Shield Inset -->
    <path d="M -60,-6 
             L 60,-6 
             L 60,34 
             C 60,76 0,102 0,102 
             C 0,102 -60,76 -60,34 
             Z" 
          fill="#161E30" stroke="#3ADBC4" stroke-width="2" opacity="0.7"/>

    <!-- Chess Rook Battlements on Top of Shield -->
    <path d="M -72,-16 L -72,-30 L -50,-30 L -50,-22 L -24,-22 L -24,-30 L 24,-30 L 24,-22 L 50,-22 L 50,-30 L 72,-30 L 72,-16 Z" 
          fill="#161E30" stroke="url(#goldGrad)" stroke-width="3"/>

    <!-- ==================== SDV TYPOGRAPHY ==================== -->
    <text x="0" y="52" 
          font-family="'Cinzel', 'Trajan Pro', 'Georgia', 'Times New Roman', serif" 
          font-size="44" 
          font-weight="900" 
          letter-spacing="4" 
          text-anchor="middle" 
          fill="url(#goldGrad)"
          stroke="#0A0E17"
          stroke-width="1.5"
          filter="url(#neonGlow)">
      SDV
    </text>

    <!-- Small Golden Gem / Star beneath SDV -->
    <polygon points="0,68 5,75 0,82 -5,75" fill="#3ADBC4" filter="url(#neonGlow)"/>
  </g>

  <!-- Decorative Corner Brackets (Gaming UI / HUD Style) -->
  <path d="M 44,76 L 44,44 L 76,44" fill="none" stroke="#3ADBC4" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 468,76 L 468,44 L 436,44" fill="none" stroke="#3ADBC4" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 44,436 L 44,468 L 76,468" fill="none" stroke="#3ADBC4" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 468,436 L 468,468 L 436,468" fill="none" stroke="#3ADBC4" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
</svg>
